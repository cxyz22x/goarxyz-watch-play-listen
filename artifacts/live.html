<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live TV — goarxyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root { --accent:#e07a7a; --bg:#07070c; --card:#14141d; --line:#262633; --text:#f4f6fb; --muted:#9aa0b4; --gold:#ffc53d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; min-height:100vh; padding-bottom:108px; }
  header { position:relative; top:0; z-index:5; display:flex; align-items:center; gap:16px; padding:calc(14px + env(safe-area-inset-top,0px)) 5vw 14px; background:var(--bg); }
  .logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:-.02em}
  .logo .marks{display:flex;gap:6px;font-size:14px;letter-spacing:2px}
  .logo .marks span:nth-child(1){color:#e8b64c}
  .logo .marks span:nth-child(2){color:#5b8def}
  .logo .marks span:nth-child(3){color:#e05d5d}
  .logo .marks span:nth-child(4){color:#5fd6a4}
  header input { margin-left:auto; width:min(280px,38vw); background:#101018; border:1px solid var(--line); color:#fff; border-radius:10px; padding:10px 14px; font:500 14px Inter,sans-serif; outline:none; }
  .go, .icon-btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:36px; border-radius:999px; border:1px solid rgba(224,93,93,.35);
    background:rgba(224,93,93,.16); color:#fff; text-decoration:none;
    font:600 12px Inter,sans-serif; letter-spacing:.08em; text-transform:uppercase;
    backdrop-filter:blur(10px);
  }
  .go { padding:0 12px 0 10px; }
  .icon-btn { width:36px; padding:0; background:rgba(244,244,245,.06); border-color:rgba(244,244,245,.12); }
  .eyebrow { color:var(--accent); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 4vw 0; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; background:transparent; border:0; color:var(--muted); font:600 14px Inter,sans-serif; padding:8px 0; cursor:pointer; }
  .chip.on { color:#fff; box-shadow:inset 0 -2px 0 #fff; }
  .hero { position:relative; min-height:46vh; margin:12px 4vw 8px; border-radius:18px; overflow:hidden; display:flex; align-items:flex-end; background:#101018 center/cover no-repeat; }
  .hero::before { content:""; position:absolute; inset:0; background:linear-gradient(to top,#07070c 4%,rgba(7,7,12,.55) 46%,rgba(7,7,12,.15)); }
  .hero-copy { position:relative; padding:28px; max-width:640px; }
  .eyebrow { color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; margin-bottom:8px; }
  .hero h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(36px,5vw,64px); letter-spacing:-.045em; line-height:.95; }
  .hero p { color:#c8cce0; margin:12px 0 18px; }
  .play { background:#fff; color:#07070c; border:0; border-radius:10px; padding:12px 18px; font-weight:800; cursor:pointer; }
  .rail { padding:18px 0 6px; }
  .rail h2 { font-family:"Space Grotesk",sans-serif; font-size:22px; padding:0 4vw 10px; }
  .row { display:flex; gap:12px; overflow-x:auto; padding:0 4vw 12px; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .card { flex:0 0 168px; width:168px; background:var(--card); border:1px solid #ffffff12; border-radius:14px; overflow:hidden; text-align:left; padding:0; color:#fff; cursor:pointer; position:relative; }
  .card img, .ph { width:100%; aspect-ratio:16/10; object-fit:contain; background:#0c0c10; display:block; }
  .ph { display:flex; align-items:center; justify-content:center; font-family:"Space Grotesk",sans-serif; font-size:26px; font-weight:700; }
  .card b { display:block; padding:8px 10px 0; font-size:13px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card span { display:block; color:var(--muted); padding:2px 10px 12px; font-size:11px; }
  .card em { position:absolute; top:8px; right:8px; background:#07070ccc; color:var(--gold); font-style:normal; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .card.on { outline:2px solid #fff; }
  .player { position:fixed; inset:0; z-index:20; background:#050507; display:none; flex-direction:column; }
  .player.open { display:flex; }
  .pbar { height:64px; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:1px solid var(--line); }
  .pbar button, .now button { border:1px solid var(--line); background:#14141d; color:#fff; cursor:pointer; }
  .pbar button { width:40px; height:40px; border-radius:10px; font-size:16px; }
  .pbar .who { min-width:0; }
  .pbar b, .pbar small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pbar small { color:var(--muted); font-size:12px; }
  .pbar select { margin-left:auto; background:#101018; color:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stage { position:relative; flex:1; background:#000; }
  video { width:100%; height:100%; background:#000; }
  .status { position:absolute; left:16px; bottom:16px; color:#fff; background:#000a; border-radius:8px; padding:6px 10px; font-size:13px; }
  .now { position:fixed; left:0; right:0; bottom:0; z-index:15; display:none; align-items:center; gap:12px; padding:10px 16px; background:#101018f2; border-top:1px solid var(--line); }
  .now.show { display:flex; }
  .now img, .now .ph { width:84px; height:48px; object-fit:contain; background:#0c0c10; border-radius:8px; }
  .now .who { min-width:0; flex:1; }
  .now small { color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .now b, .now span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now span { color:var(--muted); font-size:12px; }
  .now button { border-radius:10px; padding:10px 14px; font-weight:700; }
  .now .open { background:#fff; color:#07070c; border-color:#fff; }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">goarxyz <span class="marks"><span>○</span><span>□</span><span>△</span><span>✕</span></span></a>
  <input id="q" placeholder="Search channels" autocomplete="off" />
  <button class="icon-btn" id="settings" type="button" aria-label="Settings">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <a class="go" href="index.html">Go</a>
</header>
<div class="chips" id="chips"></div>
<section class="hero" id="hero">
  <div class="hero-copy">
    <div class="eyebrow" id="heroKicker">Live</div>
    <h1 id="heroTitle">Loading channels</h1>
    <p id="heroText">US, UK, Australia, Canada, Ireland, and New Zealand.</p>
    <button class="play" id="heroPlay" type="button">Play</button>
  </div>
</section>
<div id="rails"></div>

<div class="now" id="nowbar">
  <img id="nowLogo" alt="" referrerpolicy="no-referrer" />
  <div class="who">
    <small>Now playing</small>
    <b id="nowName">—</b>
    <span id="nowMeta">—</span>
  </div>
  <button class="open" id="nowOpen" type="button">Open</button>
  <button id="nowStop" type="button">Stop</button>
</div>

<div class="player" id="player">
  <div class="pbar">
    <button type="button" id="close" aria-label="Close">✕</button>
    <div class="who">
      <b id="playerName">Live</b>
      <small id="playerMeta">Live</small>
    </div>
    <select id="quality" aria-label="Quality">
      <option value="auto">Auto</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
    </select>
  </div>
  <div class="stage">
    <video id="video" controls autoplay playsinline></video>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
const FEEDS = [
  ["United States", "https://iptv-org.github.io/iptv/countries/us.m3u"],
  ["United Kingdom", "https://iptv-org.github.io/iptv/countries/uk.m3u"],
  ["Australia", "https://iptv-org.github.io/iptv/countries/au.m3u"],
  ["Canada", "https://iptv-org.github.io/iptv/countries/ca.m3u"],
  ["Ireland", "https://iptv-org.github.io/iptv/countries/ie.m3u"],
  ["New Zealand", "https://iptv-org.github.io/iptv/countries/nz.m3u"]
];
const BAD = /religious|shop|adult|xxx|betting|gambling/i;
const ORDER = ["News","Sports","Entertainment","Movies","Kids","Music","Documentary","Lifestyle","Business","Weather","General","Culture","Education","Science","Outdoor","Relax"];
let all = [], country = "All", query = "", hls = null, current = null, featured = null;

function parseM3U(text, countryName){
  const out = [];
  const lines = String(text||"").split(/\r?\n/);
  for (let i = 0; i < lines.length; i++){
    const line = lines[i];
    if (line.indexOf("#EXTINF") !== 0) continue;
    const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || "";
    const group = (line.match(/group-title="([^"]*)"/) || [])[1] || "General";
    const name = line.slice(line.lastIndexOf(",") + 1).trim();
    let url = "";
    for (let j = i + 1; j < lines.length; j++){
      const s = lines[j].trim();
      if (!s || s.charAt(0) === "#") continue;
      url = s; break;
    }
    if (!logo || url.indexOf("http") !== 0) continue;
    if (/imgur\.com|ibb\.co/i.test(logo)) continue;
    if (BAD.test(group) || BAD.test(name)) continue;
    if (/geo-?blocked|test card|color bars/i.test(name)) continue;
    const rm = name.match(/\((\d{3,4})p\)/);
    const res = rm ? parseInt(rm[1], 10) : 0;
    const clean = name.replace(/\s*\[[^\]]*\]\s*/g, " ").replace(/\s*\(\d{3,4}p\)\s*/g, " ").replace(/\s+/g, " ").trim();
    const cat = (group.split(";")[0] || "General").trim();
    out.push({ c: countryName, n: clean, g: cat, u: url, i: logo, r: res, k: countryName + "|" + clean.toLowerCase() });
  }
  return out;
}
function best(rows){
  const map = {};
  rows.forEach(ch => { const prev = map[ch.k]; if (!prev || (ch.r||0) > (prev.r||0)) map[ch.k] = ch; });
  return Object.values(map).sort((a,b) => (b.r||0) - (a.r||0) || a.n.localeCompare(b.n));
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    return "&" + "quot;";
  });
}
function filtered(){
  const q = query.trim().toLowerCase();
  return all.filter(ch => {
    if (country !== "All" && ch.c !== country) return false;
    if (!q) return true;
    return (ch.n + " " + ch.c + " " + ch.g).toLowerCase().includes(q);
  });
}
function card(ch){
  const res = ch.r ? ch.r + "p" : "Live";
  const on = current && current.k === ch.k ? " on" : "";
  return '<button type="button" class="card'+on+'" data-k="'+esc(ch.k)+'"><img src="'+esc(ch.i)+'" alt="" loading="lazy" referrerpolicy="no-referrer"><em>'+res+'</em><b>'+esc(ch.n)+'</b><span>'+esc(ch.c)+'</span></button>';
}
function bindCards(root){
  root.querySelectorAll(".card").forEach(btn => {
    const img = btn.querySelector("img");
    img.onerror = () => {
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = (btn.querySelector("b").textContent || "TV").slice(0, 2).toUpperCase();
      img.replaceWith(ph);
    };
    btn.onclick = () => {
      const ch = all.find(x => x.k === btn.dataset.k);
      if (ch) play(ch, true);
    };
  });
}
function paintHero(rows){
  featured = rows[0] || null;
  const hero = document.getElementById("hero");
  if (!featured){
    document.getElementById("heroTitle").textContent = "Nothing in this filter";
    document.getElementById("heroText").textContent = "";
    hero.style.backgroundImage = "none";
    return;
  }
  document.getElementById("heroKicker").textContent = featured.g + " · " + featured.c;
  document.getElementById("heroTitle").textContent = featured.n;
  document.getElementById("heroText").textContent = (featured.r ? featured.r + "p · " : "") + "Play it in the player. The bar at the bottom keeps what is on.";
  hero.style.backgroundImage = "url('" + featured.i.replace(/'/g, "") + "')";
}
function paint(){
  const rows = filtered();
  paintHero(rows);
  const groups = {};
  rows.forEach(ch => { (groups[ch.g] = groups[ch.g] || []).push(ch); });
  const names = Object.keys(groups).sort((a,b) => {
    const ia = ORDER.indexOf(a), ib = ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || groups[b].length - groups[a].length;
  }).filter(name => groups[name].length >= 4).slice(0, 10);
  const host = document.getElementById("rails");
  const blocks = [];
  if (rows.length) blocks.push('<section class="rail"><h2>' + (query ? "Results" : "Top channels") + '</h2><div class="row">' + rows.slice(0, 18).map(card).join("") + '</div></section>');
  if (!query) names.forEach(name => {
    blocks.push('<section class="rail"><h2>'+esc(name)+'</h2><div class="row">'+groups[name].slice(0, 18).map(card).join("")+'</div></section>');
  });
  host.innerHTML = blocks.join("") || '<p class="eyebrow" style="padding:24px 4vw">No channels.</p>';
  bindCards(host);
}
function chips(){
  const counts = {};
  all.forEach(ch => counts[ch.c] = (counts[ch.c]||0) + 1);
  const names = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  const el = document.getElementById("chips");
  el.innerHTML = ["All"].concat(names).map(c => '<button type="button" class="chip'+(c===country?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join("");
  el.querySelectorAll("[data-c]").forEach(btn => btn.onclick = () => {
    country = btn.dataset.c;
    el.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x===btn));
    paint();
  });
}
function setStatus(t){ document.getElementById("status").textContent = t || ""; }
function destroy(){
  if (hls){ hls.destroy(); hls = null; }
  const v = document.getElementById("video");
  v.removeAttribute("src");
  try { v.load(); } catch(e){}
}
function applyQuality(){
  if (!hls || !hls.levels) return;
  const pref = document.getElementById("quality").value;
  if (pref === "auto"){ hls.currentLevel = -1; return; }
  const want = Number(pref);
  let pick = 0, diff = Infinity;
  hls.levels.forEach((lv, i) => { const d = Math.abs((lv.height||0) - want); if (d < diff){ diff = d; pick = i; } });
  hls.currentLevel = pick;
}
function showNow(ch){
  const bar = document.getElementById("nowbar");
  bar.classList.add("show");
  document.getElementById("nowName").textContent = ch.n;
  document.getElementById("nowMeta").textContent = ch.g + " · " + ch.c + (ch.r ? " · " + ch.r + "p" : "");
  const img = document.getElementById("nowLogo");
  img.src = ch.i;
  document.getElementById("playerName").textContent = ch.n;
  document.getElementById("playerMeta").textContent = ch.g + " · " + ch.c;
}
async function play(ch, open){
  current = ch;
  showNow(ch);
  if (open) document.getElementById("player").classList.add("open");
  destroy();
  setStatus("Starting " + ch.n + "…");
  const video = document.getElementById("video");
  const native = video.canPlayType("application/vnd.apple.mpegurl");
  if (!window.Hls || !Hls.isSupported()){
    video.src = ch.u;
    setStatus(native ? "" : "This browser cannot play the stream.");
    try { await video.play(); } catch(e){}
    paint();
    return;
  }
  hls = new Hls({ enableWorker:true, lowLatencyMode:false, maxBufferLength:8 });
  hls.on(Hls.Events.MANIFEST_PARSED, () => { applyQuality(); setStatus(""); video.play().catch(()=>{}); });
  hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
    const lv = hls.levels && hls.levels[data.level];
    if (lv && lv.height){
      setStatus(lv.height + "p");
      document.getElementById("nowMeta").textContent = ch.g + " · " + ch.c + " · " + lv.height + "p";
    }
  });
  hls.on(Hls.Events.ERROR, (_, data) => { if (data && data.fatal) setStatus("Couldn't play this channel."); });
  hls.loadSource(ch.u);
  hls.attachMedia(video);
  paint();
}
function stop(){
  destroy();
  current = null;
  document.getElementById("player").classList.remove("open");
  document.getElementById("nowbar").classList.remove("show");
  paint();
}
document.getElementById("close").onclick = () => document.getElementById("player").classList.remove("open");
document.getElementById("nowOpen").onclick = () => { if (current) document.getElementById("player").classList.add("open"); };
document.getElementById("nowStop").onclick = stop;
document.getElementById("quality").onchange = applyQuality;
document.getElementById("heroPlay").onclick = () => { if (featured) play(featured, true); };
document.getElementById("q").addEventListener("input", e => { query = e.target.value || ""; paint(); });
try {
  const q = localStorage.getItem("goar-quality");
  if (q) document.getElementById("quality").value = q;
  const region = localStorage.getItem("goar-region");
  const map = { US:"United States", GB:"United Kingdom", AU:"Australia", CA:"Canada", IE:"Ireland", NZ:"New Zealand" };
  if (region && map[region]) country = map[region];
} catch (e) {}
document.getElementById("settings").onclick = () => { location.href = "index.html"; };

(async function load(){
  const parts = await Promise.all(FEEDS.map(pair =>
    fetch(pair[1]).then(r => { if (!r.ok) throw new Error(pair[0]); return r.text(); }).then(t => parseM3U(t, pair[0])).catch(() => [])
  ));
  all = best([].concat(...parts));
  chips();
  paint();
})();
</script>
<script src="site-nav.js" defer></script>
</body>
</html>
