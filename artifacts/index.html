<style>
  :root {
    --bg: #07070c;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --line: rgba(244,244,245,.12);
    --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: Inter, "Segoe UI", system-ui, sans-serif;
    --pad: clamp(20px, 4vw, 40px);
    --movies: #e8b64c;
    --tv: #5b8def;
    --music: #c084fc;
    --games: #5fd6a4;
    --live: #e05d5d;
    --anime: #a855f7;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--fg); font-family: var(--body); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  main {
    width: min(960px, 100%);
    margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) var(--pad) calc(40px + env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: clamp(48px, 8vh, 88px);
  }

.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;flex-shrink:0;letter-spacing:-0.02em;color:#eceef1;text-decoration:none;line-height:1;}
.logo .marks{display:flex;gap:6px;font-size:14px;letter-spacing:2px;line-height:1;}
.logo .marks span:nth-child(1){color:#e8b64c;}
.logo .marks span:nth-child(2){color:#5b8def;}
.logo .marks span:nth-child(3){color:#e05d5d;}
.logo .marks span:nth-child(4){color:#5fd6a4;}

  .tools { display: flex; align-items: center; gap: 8px; }
  .icon-btn, .install {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.06);
    color: var(--fg);
    backdrop-filter: blur(12px);
  }
  .install {
    width: auto;
    padding: 0 14px;
    font: 500 14px var(--body);
  }
  .install[hidden] { display: none; }
  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(56px, 10vw, 96px);
    letter-spacing: -0.045em;
    line-height: 0.92;
  }
  .lead { margin-top: 20px; max-width: 36ch; color: var(--muted); }
  nav {
    margin-top: clamp(36px, 6vh, 64px);
    display: grid;
    grid-template-columns: 1fr;
    border-top: 1px solid var(--line);
  }
  nav a.row {
    display: grid;
    grid-template-columns: 7.5rem 1fr auto;
    gap: 16px;
    align-items: center;
    min-height: 80px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--line);
    --tone: var(--movies);
  }
  nav a.row[data-tone="tv"] { --tone: var(--tv); }
  nav a.row[data-tone="music"] { --tone: var(--music); }
  nav a.row[data-tone="games"] { --tone: var(--games); }
  nav a.row[data-tone="live"] { --tone: var(--live); }
  nav a.row[data-tone="anime"] { --tone: var(--anime); }
  nav .k {
    color: color-mix(in srgb, var(--tone) 80%, #fff);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  nav b {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -0.04em;
  }
  .go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 14px 0 12px;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--tone) 45%, transparent);
    background: color-mix(in srgb, var(--tone) 16%, transparent);
    color: #fff;
    font: 500 13px var(--body);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    backdrop-filter: blur(10px);
  }
  .go svg { opacity: .9; }
  nav a.row:hover .go, nav a.row:focus-visible .go {
    background: color-mix(in srgb, var(--tone) 28%, transparent);
  }
  nav a.row:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .sheet {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(7,7,12,.62);
    display: none;
    place-items: end center;
    padding: 16px;
  }
  .sheet.on { display: grid; }
  .panel {
    width: min(420px, 100%);
    background: #12121a;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: env(safe-area-inset-bottom);
  }
  .panel h2 { font-family: var(--display); font-size: 20px; margin-bottom: 12px; }
  .panel a, .panel button.line {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    color: var(--fg);
  }
  @media (max-width: 640px) {
    nav a.row { grid-template-columns: 1fr auto; }
    nav .k { grid-column: 1 / -1; }
  }
  @media (min-width: 860px) {
    nav { grid-template-columns: 1fr 1fr; column-gap: 48px; }
  }
</style>

<script>
(function () {
  var deferred;
  var btn = document.getElementById("install");
  var sheet = document.getElementById("sheet");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { btn.hidden = true; deferred = null; });
  });
  function openSheet() { sheet.hidden = false; sheet.classList.add("on"); }
  function closeSheet() { sheet.classList.remove("on"); sheet.hidden = true; }
  document.getElementById("settings").addEventListener("click", openSheet);
  document.getElementById("sheetClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) closeSheet(); });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }
})();
</script>
