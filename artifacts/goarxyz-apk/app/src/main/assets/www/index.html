<script>
(function () {
  var origin = location.origin && location.origin !== "null" ? location.origin : "";
  if (origin) {
    var here = origin + location.pathname.replace(/index\.html$/, "");
    var canon = document.querySelector('link[rel="canonical"]');
    var ogUrl = document.querySelector('meta[property="og:url"]');
    if (canon) canon.href = here;
    if (ogUrl) ogUrl.setAttribute("content", here);
    ["og:image", "twitter:image"].forEach(function (name) {
      var el = document.querySelector(name.indexOf("twitter") === 0 ? 'meta[name="' + name + '"]' : 'meta[property="' + name + '"]');
      if (el && el.content && el.content.indexOf("http") !== 0) el.content = new URL(el.content, here).href;
    });
    var ld = document.querySelector('script[type="application/ld+json"]');
    if (ld) {
      try {
        var data = JSON.parse(ld.textContent);
        data.url = here;
        ld.textContent = JSON.stringify(data);
      } catch (e) {}
    }
  }
  var deferred;
  var btn = document.getElementById("install");
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    btn.hidden = false;
  });
  btn.addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () { btn.hidden = true; deferred = null; });
  });
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(function () {});
    });
  }
})();
</script>
