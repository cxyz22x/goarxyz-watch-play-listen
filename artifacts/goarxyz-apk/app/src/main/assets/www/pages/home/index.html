<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>goarxyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/shared/float.css" />
<style>
  :root { --bg:#07070c; --muted:#9aa0b4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(60vw 36vh at 0% -10%, #ffc53d22, transparent 55%), #07070c; color:#f4f6fb; font-family:Inter,system-ui,sans-serif; }
  main { padding:8vh 6vw 12vh; }
  .logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;letter-spacing:-0.02em;color:#eceef1;text-decoration:none;line-height:1;margin-bottom:28px}
  .logo .marks{display:flex;gap:6px;font-size:14px;letter-spacing:2px}
  .logo .marks span:nth-child(1){color:#e8b64c}
  .logo .marks span:nth-child(2){color:#5b8def}
  .logo .marks span:nth-child(3){color:#e05d5d}
  .logo .marks span:nth-child(4){color:#5fd6a4}
  h1 { font-family:"Space Grotesk",sans-serif; font-size:clamp(42px,7vw,80px); letter-spacing:-.045em; line-height:.92; }
  p { color:var(--muted); max-width:42ch; margin:14px 0 28px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  a.tile { display:block; min-height:160px; padding:20px; border-radius:16px; background:#14141d; border:1px solid #ffffff14; color:#fff; text-decoration:none; }
  a.tile b { display:block; font-family:"Space Grotesk",sans-serif; font-size:28px; margin:8px 0; }
  a.tile span { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<main>
  <a class="logo" href="/index.html">goarxyz <span class="marks"><span>○</span><span>□</span><span>△</span><span>✕</span></span></a>
  <h1>Watch. Listen.<br>Play.</h1>
  <p>Each page has its own bar. The gear in the corner switches pages.</p>
  <div class="tiles">
    <a class="tile" href="/pages/watch/index.html?tab=movie"><span>Watch</span><b>Movies</b></a>
    <a class="tile" href="/pages/watch/index.html?tab=tv"><span>Watch</span><b>TV</b></a>
    <a class="tile" href="/pages/music/index.html"><span>Listen</span><b>Music</b></a>
    <a class="tile" href="/pages/games/index.html"><span>Play</span><b>Games</b></a>
    <a class="tile" href="/pages/live/index.html"><span>Live</span><b>Live TV</b></a>
    <a class="tile" href="/pages/anime/index.html"><span>Watch</span><b>Anime</b></a>
  </div>
</main>
<script src="/shared/float.js" defer></script>
</body>
</html>
