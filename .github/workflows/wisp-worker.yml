name: Deploy WISP Worker

on:
  push:
    branches: [main]
    paths: ["wisp-worker/**", ".github/workflows/wisp-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck worker
        run: |
          npm install --no-save typescript @cloudflare/workers-types
          npx tsc --noEmit --project wisp-worker
      - name: Sync SOCKS5 proxy list
        if: env.WISP_SOCKS5_SET == 'true'
        run: printf '%s' "${{ secrets.WISP_SOCKS5 }}" | npx wrangler secret put WISP_SOCKS5
        working-directory: wisp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WISP_SOCKS5_SET: ${{ secrets.WISP_SOCKS5 != '' }}
      - name: Deploy goarxyz-wisp
        run: npx wrangler deploy
        working-directory: wisp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
