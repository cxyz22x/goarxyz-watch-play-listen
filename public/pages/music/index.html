      return "";
    }

    /* Resolve audio CDN URL via native Spotify pipeline (Mercury + storage-resolve)
       Returns { url, mimeType } or throws. */
    async function resolveSpotifyNative(trackId) {
      const token = await getStokenToken();
      if (!token) throw new Error("stoken unavailable");

      const gid = base62ToHex(trackId);
      const spBase = spClientHost || SpotifyEndpoints.spClientUrl();
      const headers = {
        "authorization": "Bearer " + token,
        "accept": "application/protobuf",
        "app-platform": "WebPlayer",
        "spotify-app-version": liveVer(),
        "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
        "origin": "https://open.spotify.com",
        "referer": "https://open.spotify.com/"
      };

      /* Step 1: Mercury metadata */
      const metaR = await fetchAny(
        spBase + "/metadata/4/track/" + gid,
        { headers },
        12000
      );
      if (!metaR || !metaR.ok) throw new Error("Mercury metadata HTTP " + (metaR && metaR.status));
      const metaBuf = new Uint8Array(await metaR.arrayBuffer());
      const files = _parseMercuryTrack(metaBuf);
      if (!files.length) throw new Error("no audio files in metadata");

      /* Step 2: storage-resolve — try each file format in preference order */
      let cdnUrl = "", mimeType = "audio/mpeg";
      for (const f of files) {
        try {
          const srR = await fetchAny(
            spBase + "/storage-resolve/files/audio/interactive/" + f.fileId,
            { headers },
            10000
          );
          if (!srR || !srR.ok) continue;
          const srBuf = new Uint8Array(await srR.arrayBuffer());
          const url = _parseStorageResolve(srBuf);
          if (!url) continue;
          cdnUrl = url;
          /* Determine MIME from format */
          if (f.format === 19 || f.format === 18 || f.format === 17) mimeType = "audio/ogg; codecs=vorbis";
          else mimeType = "audio/mpeg";
          break;
        } catch { /* try next format */ }
      }
      if (!cdnUrl) throw new Error("storage-resolve returned no CDN URL");
      return { url: cdnUrl, mimeType };
    }

    /* ── gamepvz Spotify full-track resolver ──
       POSTs the Spotify track URL to gamepvz.com's download API.
       Returns a plain MP3 URL — no DRM, decodes fine with decodeAudioData. */
    function decodeSpotifyFileUrl(raw){
      raw=String(raw||"");
      if(raw.includes("?url=")){
        let b64=raw.split("?url=")[1]||"";
        b64+=("===".slice((b64.length+3)%4||4));
        try{ return atob(b64.replace(/-/g,"+").replace(/_/g,"/")); }catch{}
      }
      if(raw.startsWith("/")) return "https://gamepvz.com"+raw;
      return raw;
    }

    async function spotifyUrlPlays(url){
      try{
        const r=await fetchAny(url,{
          headers:{"user-agent":"Mozilla/5.0","range":"bytes=0-15","accept":"audio/mpeg,*/*"}
        },5000);
        if(!r||(!r.ok&&r.status!==206)) return false;
        const type=r.headers&&r.headers.get("content-type")||"";
        if(/text|html|json/i.test(type)) return false;
        /* Check for ID3 magic or audio content-type */
        const buf=await r.arrayBuffer();
        const bytes=new Uint8Array(buf);
        const isId3=(bytes[0]===0x49&&bytes[1]===0x44&&bytes[2]===0x33);
        return isId3||/audio/i.test(type);
      }catch{ return false; }
    }

    async function usableSpotifyUrl(url){
      let parsed; try{ parsed=new URL(url); }catch{ return ""; }
      const hosts=[...new Set([parsed.hostname,...SPOTIFY_CDN_HOSTS])];
      return new Promise(resolve=>{
        let pending=hosts.length, settled=false;
        for(const host of hosts){
          const next=new URL(url); next.hostname=host;
          const candidate=next.toString();
          spotifyUrlPlays(candidate).then(ok=>{
            if(ok&&!settled){ settled=true; resolve(candidate); }
            pending-=1;
            if(!pending&&!settled) resolve("");
          });
        }
      });
    }

    async function requestSpotifyFile(trackId){
      const r=await fetchAny("https://gamepvz.com/api/download/get-url",{
        method:"POST",
        headers:{
          "content-type":"application/json",
          "user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
          "origin":"https://gamepvz.com",
          "referer":"https://gamepvz.com/"
        },
        body:JSON.stringify({ url:"https://open.spotify.com/track/"+trackId })
      },10000);
      if(!r||!r.ok) throw new Error("gamepvz HTTP "+(r&&r.status));
      const data=await r.json();
      if(data.code!==200||!data.originalVideoUrl) throw new Error(data.msg||"no full track url");
      const fileUrl=decodeSpotifyFileUrl(data.originalVideoUrl);
      const parsed=new URL(fileUrl);
      if(parsed.protocol!=="https:") throw new Error("bad audio url protocol");
      return { data, fileUrl:parsed.toString() };
    }

    async function resolveSpotifyFile(trackId, bustCache){
      /* bustCache=true forces a fresh request even if the cache has an entry —
         used when a previously-resolved URL fails to decode (expired CDN URL). */
      if(!bustCache){
        const hit=spotifyFileCache.get(trackId);
        if(hit&&hit.exp>Date.now()) return hit;
      } else {
        spotifyFileCache.delete(trackId);
      }
      let last="gamepvz down";
      for(let attempt=0;attempt<2;attempt++){
        try{
          const {data,fileUrl}=await requestSpotifyFile(trackId);
          const url=await usableSpotifyUrl(fileUrl);
          if(!url){ last="audio host down"; continue; }
          const row={
            url,
            title:data.title||"",
            artist:data.authorName||"",
            cover:data.coverUrl||"",
            exp:Date.now()+6*60*60*1000
          };
          spotifyFileCache.set(trackId,row);
          return row;
        }catch(err){ last=String((err&&err.message)||err); }
      }
      throw new Error(last);
    }

    /* ============================================================
       WIDEVINE EME — spclient license relay
       ─────────────────────────────────────────────────────────────
       Activated only when the <video> element fires an `encrypted`
       event, meaning the stream contains CENC-protected content.
       Plain-text Tier-1/Tier-2 streams never trigger this path.
       ============================================================ */

    /* Build the standard Spotify-compatible Widevine license request headers */
    function _wvLicenseHeaders() {
      const token = anonSession && anonSession.token || "";
      const ct    = anonSession && anonSession.clientToken || "";
      const h = {
        "content-type": "application/octet-stream",
        "accept":       "application/octet-stream",
        "user-agent":   "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
        "app-platform": "WebPlayer",
        "spotify-app-version": liveVer(),
        "origin":   "https://open.spotify.com",
        "referer":  "https://open.spotify.com/",
      };
      if (token) h["authorization"] = "Bearer " + token;
      if (ct)    h["client-token"]  = ct;
      return h;
    }

    /* Send a raw Widevine license challenge to the spclient /widevine-license
       endpoint, rotating across all spclient nodes on failure.
       Returns the raw license response bytes (Uint8Array). */
    async function _requestWidevineLicense(challenge) {
      const body = challenge instanceof Uint8Array ? challenge : new Uint8Array(challenge);
      let lastErr = "no spclient node available";
      for (let i = 0; i < SPCLIENT_HOSTS.length; i++) {
        const base = i === 0 ? SpotifyEndpoints.spClientUrl() : SpotifyEndpoints.nextSpClient();
        const url  = base + "/widevine-license/v1/audio/license";
        try {
          const r = await fetchAny(url, {
            method: "POST",
            headers: _wvLicenseHeaders(),
            body
          }, 12000);
          if (r && r.ok) {
            const buf = await r.arrayBuffer();
            return new Uint8Array(buf);
          }
          if (r && r.status === 401) {
            /* Token expired — clear and let the next playback re-mint it */
            anonSession = null;
          }
          lastErr = "spclient license HTTP " + (r && r.status);
        } catch (e) {
          lastErr = String((e && e.message) || e);
        }
      }
      throw new Error("Widevine license failed: " + lastErr);
    }

    /* Attach Widevine EME handling to a video element.
       Safe to call multiple times — installs the listener only once per element
       (tracked via a WeakSet). */
    const _wvAttached = new WeakSet();
    function attachWidevine(videoEl) {
      if (!videoEl || _wvAttached.has(videoEl)) return;
      if (typeof navigator.requestMediaKeySystem !== "function") return;
      _wvAttached.add(videoEl);

      videoEl.addEventListener("encrypted", async (evt) => {
        /* Only handle CENC init data — the format used by Spotify */
        if (evt.initDataType && evt.initDataType !== "cenc" && evt.initDataType !== "keyids") return;

        try {
          /* 1. Acquire MediaKeys for com.widevine.alpha */
          const access = await navigator.requestMediaKeySystem("com.widevine.alpha", [{
            initDataTypes: ["cenc"],
            videoCapabilities: [],
            audioCapabilities: [
              { contentType: 'audio/mp4; codecs="mp4a.40.2"' },
              { contentType: 'audio/webm; codecs="opus"' },
            ],
            distinctiveIdentifier: "not-allowed",
            persistentState: "not-allowed",
          }]);

          /* Install on element — idempotent if already set */
          let mk = videoEl._wvMediaKeys;
          if (!mk) {
            mk = await access.createMediaKeys();
            videoEl._wvMediaKeys = mk;
            await videoEl.setMediaKeys(mk);
          }

          /* 2. Create a temporary key session */
          const session = mk.createSession("temporary");

          session.addEventListener("message", async (msgEvt) => {
            /* msgEvt.message is the raw Widevine challenge (ArrayBuffer) */
            try {
              setStatus("DRM · license request…");
              const license = await _requestWidevineLicense(new Uint8Array(msgEvt.message));
              await session.update(license);
              setStatus("DRM · keys installed");
            } catch (e) {
              console.error("[WV] license update failed:", e.message);
              setStatus("DRM error: " + (e.message || "license failed"));
            }
          });

          /* 3. Trigger the license challenge from the PSSH init data */
          await session.generateRequest(evt.initDataType, evt.initData);

        } catch (e) {
          console.error("[WV] EME setup failed:", e.message);
          setStatus("DRM error: " + (e.message || "EME setup failed"));
        }
      });
    }

    /* ============================================================
       SPOTIFY DEALER — WebSocket push channel
       ─────────────────────────────────────────────────────────────
       Connects to a dealer-g2 node authenticated with the live
       access token.  Handles reconnection across all 4 nodes with
       exponential backoff (1 s → 2 s → 4 s → 8 s, capped at 30 s).
       Messages are delivered to SpotifyDealer.onMessage if set.
       ============================================================ */
    const SpotifyDealer = (() => {
      let _ws = null;
      let _nodeIdx = 0;
      let _backoff = 1000;
      let _retryTimer = null;
      let _pingTimer = null;
      let _stopped = false;
      let _connected = false;
      let _onMessage = null;

      function _wssUrl() {
        const host = DEALER_HOSTS[_nodeIdx % DEALER_HOSTS.length].replace(/:443$/, "");
        const token = (anonSession && anonSession.token) || "";
        return "wss://" + host + "/?access_token=" + encodeURIComponent(token);
      }

      function _schedulePing(ws) {
        clearTimeout(_pingTimer);
        /* Spotify dealer expects a {"type":"ping"} every <=30 s */
        _pingTimer = setTimeout(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: "ping" })); } catch { }
            _schedulePing(ws);
          }
        }, 25000);
      }

      function _connect() {
        if (_stopped) return;
        /* Require a minted token before opening the WebSocket */
        if (!anonSession || !anonSession.token) {
          _retryTimer = setTimeout(_connect, 2000);
          return;
        }
        try {
          const url = _wssUrl();
          const ws = new WebSocket(url);
          _ws = ws;

          ws.onopen = () => {
            _connected = true;
            _backoff = 1000;
            console.log("[dealer] connected ->", DEALER_HOSTS[_nodeIdx % DEALER_HOSTS.length]);
            _schedulePing(ws);
          };

          ws.onmessage = (evt) => {
            let msg;
            try { msg = JSON.parse(evt.data); } catch { return; }
            if (msg && msg.type === "pong") return;
            if (typeof _onMessage === "function") {
              try { _onMessage(msg); } catch { }
            }
          };

          ws.onerror = () => { /* always followed by onclose — handle reconnect there */ };

          ws.onclose = () => {
            _connected = false;
            clearTimeout(_pingTimer);
            if (_stopped) return;
            /* Rotate node and schedule reconnect with backoff */
            _nodeIdx = (_nodeIdx + 1) % DEALER_HOSTS.length;
            const delay = Math.min(_backoff, 30000);
            _backoff = Math.min(_backoff * 2, 30000);
            console.log("[dealer] closed — retry in", delay, "ms via node", _nodeIdx);
            _retryTimer = setTimeout(_connect, delay);
          };

        } catch (e) {
          _nodeIdx = (_nodeIdx + 1) % DEALER_HOSTS.length;
          const delay = Math.min(_backoff, 30000);
          _backoff = Math.min(_backoff * 2, 30000);
          _retryTimer = setTimeout(_connect, delay);
        }
      }

      return {
        start() { _stopped = false; _connect(); },
        stop() {
          _stopped = true;
          clearTimeout(_retryTimer); clearTimeout(_pingTimer);
          if (_ws) { try { _ws.close(); } catch { } _ws = null; }
          _connected = false;
        },
        get connected() { return _connected; },
        set onMessage(fn) { _onMessage = fn; },
        get onMessage() { return _onMessage; },
      };
    })();



    /* ============================================================
       AUDIO ENGINE
       ─────────────────────────────────────────────────────────────
       Streaming path  (kind="stream"):  hidden <video> element fed
         by a WISP-piped MediaSource.  Starts in ~1s, no decode wait.
         Used for Tier 1 (gamepvz MP3) and Tier 2 (YouTube WebM/MP4).
       WA path  (kind="wa"):  legacy AudioBufferSource used only for
         local files and Tier-3 30 s previews (small buffers).
       Both paths feed a Web Audio AnalyserNode for the wave canvas.
       ============================================================ */
    const engine = {
      kind: "",          // "stream" | "wa" | ""
      /* stream state */
      streamEl: null,    // the <video> element (points to #streamEl)
      streamSrc: null,   // MediaElementAudioSourceNode — created once, never destroyed
      /* wa state (local files + preview only) */
      waCtx: null, waSource: null,
      waDur: 0, waStartAt: 0, waOffset: 0, waPaused: false,
      /* shared */
      isPreview: false,
      waAnalyser: null,  // AnalyserNode — rebuilt each playback
      waGain: null       // GainNode   — rebuilt each playback
    };

    function getAudioContext() {
      if (!engine.waCtx || engine.waCtx.state === "closed") {
        try { engine.waCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch { engine.waCtx = null; }
      }
      return engine.waCtx;
    }
    function gainValue() { return Math.max(0, Math.min(1, (S.prefs().vol || 80) / 100)); }
    function destroyWaSource() {
      try { if (engine.waSource) { engine.waSource.onended = null; engine.waSource.stop(0); } } catch { }
      engine.waSource = null;
    }
    function suspendWa() { if (engine.waCtx && engine.waCtx.state === "running") engine.waCtx.suspend().catch(() => { }); }
    function resumeWa() { if (engine.waCtx && engine.waCtx.state === "suspended") engine.waCtx.resume().catch(() => { }); }
    function waCurrentTime() {
      if (engine.kind === "stream" && engine.streamEl) return engine.streamEl.currentTime || 0;
      if (engine.kind !== "wa" || !engine.waCtx) return 0;
      if (engine.waPaused) return engine.waOffset;
      return engine.waOffset + (engine.waCtx.currentTime - engine.waStartAt);
    }

    /* ── Shared graph builder: analyser → gain → destination ──
       Called by both playStream and playWa after creating their source node. */
    function _buildGraph(sourceNode) {
      const ctx = engine.waCtx;
      if (!ctx) return;
      /* Fully disconnect old downstream nodes first */
      if (engine.waAnalyser) { try { engine.waAnalyser.disconnect(); } catch { } }
      if (engine.waGain)     { try { engine.waGain.disconnect(); }     catch { } }
      /* Disconnect the source node from any stale connections so only the new
         analyser receives its output (avoids silent duplicate/dead connections). */
      try { sourceNode.disconnect(); } catch { }
      engine.waAnalyser = ctx.createAnalyser();
      engine.waAnalyser.fftSize = 256;
      engine.waAnalyser.smoothingTimeConstant = 0.8;
      engine.waGain = ctx.createGain();
      engine.waGain.gain.value = gainValue();
      sourceNode.connect(engine.waAnalyser);
      engine.waAnalyser.connect(engine.waGain);
      engine.waGain.connect(ctx.destination);
    }

    /* ── WISP-piped MediaSource streaming ──────────────────────────
       Fetches the audio URL through the WISP tunnel and pumps the
       bytes into a MediaSource so the <video> element can start
       playing before the full download is complete.
       mimeType: MIME for MediaSource.addSourceBuffer —
         "audio/mpeg" for MP3,  "audio/webm; codecs=opus" for WebM,
         "audio/mp4; codecs=mp4a.40.2" for AAC/M4A.              */
    async function wispStream(videoEl, url, ua, mimeType) {
      /* Clean up any existing MediaSource on this element */
      if (videoEl.src && videoEl.src.startsWith("blob:")) {
        try { URL.revokeObjectURL(videoEl.src); } catch { }
      }
      videoEl.removeAttribute("src");
      videoEl.load();

      /* Detect MIME from URL/UA if caller didn't specify */
      if (!mimeType) {
        if (/\.mp3(\?|$)/i.test(url) || /audio\/mpeg/i.test(url)) mimeType = "audio/mpeg";
        else if (/webm/i.test(url)) mimeType = "audio/webm; codecs=opus";
        else if (/\.m4a|\.aac|mp4a/i.test(url)) mimeType = "audio/mp4; codecs=mp4a.40.2";
        else mimeType = "audio/mpeg"; // best guess
      }

      /* If MediaSource not supported or MIME not supported → direct src fallback */
      if (!window.MediaSource || !MediaSource.isTypeSupported(mimeType)) {
        videoEl.src = url;
        return;
      }

      const ms = new MediaSource();
      const msBlobUrl = URL.createObjectURL(ms);
      videoEl.src = msBlobUrl;

      await new Promise((res, rej) => {
        ms.addEventListener("sourceopen", res, { once: true });
        ms.addEventListener("error",      rej, { once: true });
        setTimeout(() => rej(new Error("MediaSource open timeout")), 8000);
      });

      const sb = ms.addSourceBuffer(mimeType);
      sb.mode = "sequence";

      /* Stream via WISP fetch, fall back to direct */
      let response;
      try {
        response = await Promise.race([
          wispFetch(url, { headers: ua ? { "user-agent": ua } : {} }),
          new Promise((_, r) => setTimeout(() => r(new Error("stream-fetch-timeout")), 30000))
        ]);
      } catch {
        response = await fetch(url, { headers: ua ? { "user-agent": ua } : {} });
      }
      if (!response || !response.ok) throw new Error("stream HTTP " + (response && response.status));

      const reader = response.body.getReader();
      const pump = async () => {
        while (true) {
          const { done, value } = await reader.read();
          if (done) {
            try {
              if (ms.readyState === "open") {
                if (sb.updating) await new Promise(r => sb.addEventListener("updateend", r, { once: true }));
                ms.endOfStream();
              }
            } catch { }
            return;
          }
          if (sb.updating) await new Promise(r => sb.addEventListener("updateend", r, { once: true }));
          /* Abort if the element has moved on to a different source */
          if (videoEl.src !== msBlobUrl) { try { reader.cancel(); } catch {} return; }
          try { sb.appendBuffer(value); } catch { return; }
        }
      };
      pump().catch(() => {});
    }

    /* ── playStream: set a streaming audio URL on the video element ──
       This is the primary playback path for Tier 1 and Tier 2.
       Returns a Promise that resolves when the element can play.   */
    async function playStream(url, ua, mimeType, label, isPreview) {
      const ctx = getAudioContext();
      if (!ctx) throw new Error("no AudioContext");

      const videoEl = document.getElementById("streamEl");
      if (!videoEl) throw new Error("no streamEl");

      /* Tear down legacy WA path */
      destroyWaSource();

      /* Attach Widevine EME handler once — no-op on plain-text streams */
      attachWidevine(videoEl);

      /* createMediaElementSource can only be called once per element across the
         entire page lifetime. Store it on the engine object and reuse it.
         On the first call it will be null; on subsequent calls it already exists. */
      if (!engine.streamSrc) {
        engine.streamSrc = ctx.createMediaElementSource(videoEl);
      }
      /* Rebuild the analyser/gain graph — _buildGraph disconnects old nodes first */
      _buildGraph(engine.streamSrc);

      engine.kind = "stream";
      engine.streamEl = videoEl;
      engine.isPreview = !!isPreview;
      engine.waPaused = false;

      if (ctx.state === "suspended") await ctx.resume();

      /* Start pumping bytes via WISP */
      await wispStream(videoEl, url, ua, mimeType);

      /* Wait for enough data to start playing */
      await new Promise((res, rej) => {
        const timeout = setTimeout(() => rej(new Error("canplay timeout")), 20000);
        const onCan = () => { clearTimeout(timeout); videoEl.removeEventListener("error", onErr); res(); };
        const onErr = () => { clearTimeout(timeout); videoEl.removeEventListener("canplay", onCan); rej(new Error("video error " + (videoEl.error && videoEl.error.code))); };
        if (videoEl.readyState >= 2) { clearTimeout(timeout); res(); return; }
        videoEl.addEventListener("canplay", onCan, { once: true });
        videoEl.addEventListener("error",   onErr, { once: true });
      });

      /* Attach ended/timeupdate handlers */
      videoEl.onended = () => {
        if (engine.kind === "stream" && engine.streamEl === videoEl) {
          state.playing = false;
          _stopWaveLoop();
          paintNow();
          next();
        }
      };

      state.playing = true;
      videoEl.volume = gainValue();
      videoEl.play().catch(() => {});

      startWave();
      paintNow();
      setStatus((label || "Spotify") + (isPreview ? " · preview" : " · streaming"));
    }

    /* ============================================================
       WAVE VISUALIZER  (frequency-bar canvas, Web Audio AnalyserNode)
       Two targets: #waveCanvas (full player panel) + #dockWave (dock bar)
       ============================================================ */
    let _waveRaf = null; // requestAnimationFrame handle

    /* _sizeCanvas: set canvas pixel buffer from CSS layout size.
       Must be called after layout is known (deferred via rAF on panel open). */
    function _sizeCanvas(canvas, fallbackW, fallbackH) {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth || fallbackW;
      const cssH = canvas.clientHeight || fallbackH;
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);
      return dpr;
    }

    function startWave() {
      /* If no analyser yet (AudioContext not yet created), start wave will be
         called again by playStream once the graph is built. */
      if (!engine.waAnalyser) return;

      /* Cancel any running loop before starting a fresh one */
      cancelAnimationFrame(_waveRaf);
      _waveRaf = null;

      const npCanvas = document.getElementById("waveCanvas");
      const dockCanvas = document.getElementById("dockWave");

      /* Size the dock canvas immediately — it is always visible in the DOM.
         The NP panel canvas gets sized here too (may be 0 if panel is closed,
         but the fallback dimensions are used and drawing still works offscreen). */
      const dpr = window.devicePixelRatio || 1;
      if (dockCanvas) {
        /* Use getBoundingClientRect for reliable sub-pixel dimensions */
        const rect = dockCanvas.getBoundingClientRect();
        const cssW = (rect && rect.width > 0 ? rect.width : null) || dockCanvas.offsetWidth || 48;
        const cssH = (rect && rect.height > 0 ? rect.height : null) || dockCanvas.offsetHeight || 28;
        dockCanvas.width = Math.round(cssW * dpr);
        dockCanvas.height = Math.round(cssH * dpr);
      }
      if (npCanvas) _sizeCanvas(npCanvas, 420, 64);

      const npCtx = npCanvas ? npCanvas.getContext("2d") : null;
      const dkCtx = dockCanvas ? dockCanvas.getContext("2d") : null;
      const analyser = engine.waAnalyser;
      const bufLen = analyser.frequencyBinCount; // fftSize/2 = 128
      const dataArr = new Uint8Array(bufLen);
      /* Use only the lower 60% of bins (melodic range) */
      const numBins = Math.floor(bufLen * 0.6);

      /* NP panel bar geometry — recomputed each frame so panel open/close resizes */
      const npBarCount = 48, npGap = 2 * dpr;
      const npBarW_base = () => {
        const w = npCanvas ? npCanvas.width : 420 * dpr;
        return (w - npGap * (npBarCount - 1)) / npBarCount;
      };

      /* Dock bar geometry */
      const dkBarCount = 12, dkGap = 1 * dpr;
      const dkBarW_base = () => {
        const w = dockCanvas ? dockCanvas.width : 48 * dpr;
        return (w - dkGap * (dkBarCount - 1)) / dkBarCount;
      };

      function draw() {
        if (!engine.waAnalyser) { _stopWaveLoop(); return; }
        /* Continue drawing even when paused — show frozen bars at last position */
        _waveRaf = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArr);

        /* ── NP panel canvas ── */
        if (npCtx && npCanvas) {
          const npH = npCanvas.height;
          const npBarW = npBarW_base();
          npCtx.clearRect(0, 0, npCanvas.width, npH);
          for (let i = 0; i < npBarCount; i++) {
            const bin = Math.round((i / npBarCount) * numBins);
            const v = dataArr[bin] / 255;
            const h = Math.max(2 * dpr, v * npH);
            const x = i * (npBarW + npGap);
            const y = npH - h;
            const alpha = 0.35 + v * 0.65;
            npCtx.fillStyle = `rgba(168,85,247,${alpha.toFixed(2)})`;
            npCtx.beginPath();
            if (npCtx.roundRect) npCtx.roundRect(x, y, npBarW, h, [2 * dpr, 2 * dpr, 0, 0]);
            else npCtx.rect(x, y, npBarW, h);
            npCtx.fill();
          }
        }

        /* ── Dock mini-wave canvas ── */
        if (dkCtx && dockCanvas) {
          const dkH = dockCanvas.height;
          const dkBarW = dkBarW_base();
          dkCtx.clearRect(0, 0, dockCanvas.width, dkH);
          for (let i = 0; i < dkBarCount; i++) {
            const bin = Math.round((i / dkBarCount) * numBins);
            const v = dataArr[bin] / 255;
            const h = Math.max(1 * dpr, v * dkH);
            const x = i * (dkBarW + dkGap);
            const y = dkH - h;
            const alpha = engine.waPaused ? 0.2 : (0.3 + v * 0.7);
            dkCtx.fillStyle = `rgba(168,85,247,${alpha.toFixed(2)})`;
            dkCtx.beginPath();
            if (dkCtx.roundRect) dkCtx.roundRect(x, y, dkBarW, h, [1 * dpr, 1 * dpr, 0, 0]);
            else dkCtx.rect(x, y, dkBarW, h);
            dkCtx.fill();
          }
        }
      }

      /* Start immediately on the next animation frame */
      _waveRaf = requestAnimationFrame(draw);
    }

    function _stopWaveLoop() {
      if (_waveRaf) { cancelAnimationFrame(_waveRaf); _waveRaf = null; }
    }

    function stopWave() {
      _stopWaveLoop();
      /* Clear both canvases */
      const npCanvas = document.getElementById("waveCanvas");
      if (npCanvas) { const c = npCanvas.getContext("2d"); if (c) c.clearRect(0, 0, npCanvas.width, npCanvas.height); }
      const dkCanvas = document.getElementById("dockWave");
      if (dkCanvas) { const c = dkCanvas.getContext("2d"); if (c) c.clearRect(0, 0, dkCanvas.width, dkCanvas.height); }
    }

    function destroyEngine() {
      stopWave();
      /* Stop the video element (do NOT destroy streamSrc — it's permanent) */
      const videoEl = document.getElementById("streamEl");
      if (videoEl) {
        videoEl.pause();
        videoEl.onended = null;
        const blobUrl = videoEl.src;
        videoEl.removeAttribute("src");
        videoEl.load();
        if (blobUrl && blobUrl.startsWith("blob:")) { try { URL.revokeObjectURL(blobUrl); } catch {} }
      }
      engine.streamEl = null;
      /* Tear down WA path */
      destroyWaSource();
      if (engine.waAnalyser) { try { engine.waAnalyser.disconnect(); } catch { } engine.waAnalyser = null; }
      if (engine.waGain)     { try { engine.waGain.disconnect(); }     catch { } engine.waGain = null; }
      engine.kind = ""; engine.waDur = 0; engine.waOffset = 0; engine.waStartAt = 0;
      engine.waPaused = false; engine.isPreview = false;
    }

    /* fetchAndDecode kept for local files and Tier-3 30 s previews (small buffers only) */
    async function fetchAndDecode(url) {
      let buf = null;
      try {
        const r = await Promise.race([
          wispFetch(url, {}),
          new Promise((_, rej) => setTimeout(() => rej(new Error("fetch-timeout")), 30000))
        ]);
        if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
        buf = await r.arrayBuffer();
      } catch (e) {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 30000);
        try {
          const r = await fetch(url, { signal: ctrl.signal });
          if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
          buf = await r.arrayBuffer();
        } finally { clearTimeout(t); }
      }
      const ctx = getAudioContext();
      if (!ctx) throw new Error("AudioContext unavailable");
      if (ctx.state === "suspended") await ctx.resume();
      return ctx.decodeAudioData(buf);
    }

    async function playWa(audioBuf, offset, auto, label, isPreview) {
      const ctx = getAudioContext();
      if (!ctx) throw new Error("no AudioContext");
      destroyWaSource();
      /* Stop any active stream (keep streamSrc node — it's permanent) */
      const videoEl = document.getElementById("streamEl");
      if (videoEl) { videoEl.pause(); videoEl.onended = null; }
      engine.streamEl = null;
      /* Build audio graph via shared helper */
      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      _buildGraph(src);
      engine.waSource = src;
      engine.waDur = audioBuf.duration;
      engine.waOffset = Math.max(0, Math.min(offset || 0, audioBuf.duration));
      engine.waStartAt = ctx.currentTime;
      engine.waPaused = false;
      engine.kind = "wa";
      engine.isPreview = !!isPreview;
      if (ctx.state === "suspended") await ctx.resume();
      src.start(0, engine.waOffset);
      src.onended = () => {
        if (engine.kind === "wa" && !engine.waPaused && engine.waSource === src) {
          state.playing = false;
          _stopWaveLoop(); // stop the RAF loop; canvas retains last frame until next song
          paintNow();
          const elapsed = engine.waOffset + (ctx.currentTime - engine.waStartAt);
          if (elapsed >= engine.waDur - 0.5) next();
        }
      };
      if (auto) {
        state.playing = true;
        startWave();
      } else {
        /* Only suspend if running — guard against already-suspended context */
        if (ctx.state === "running") await ctx.suspend();
        engine.waPaused = true; state.playing = false;
        /* Do NOT call stopWave() here — the draw loop keeps running frozen so
           that when the panel is opened in a paused state the canvas shows bars. */
      }
      paintNow();
      setStatus((label || "Spotify") + (isPreview ? " · preview" : " · full track"));
    }

    /* ============================================================
       STATE
       ============================================================ */
    const state = {
      view: "home",
      tops: [], news: [],
      list: S.list().length ? S.list() : SEED_TRACKS.slice(),
      i: 0, playing: false, token: 0, skip: 0
    };
    const current = () => state.list[state.i] || null;

    function setStatus(msg) { const el = $("#playStatus"); if (el) el.textContent = msg; }

    /* Art URL helpers — Spotify CDN only */
    function spArt(song, size) {
      if (!song) return phArt;
      if (song.cover) return song.cover;
      return phArt;
    }

    function safeImg(el, src, fallback) {
      if (!el) return;
      const fb = fallback || phArt;
      const target = src || fb;
      const current = el.getAttribute("src") || "";
      /* Skip only when the element is already showing the exact same real (non-placeholder) URL
         and it has loaded successfully. Never skip when upgrading from placeholder to real URL. */
      if (current === target && target !== phArt && target !== fb && el.complete && el.naturalWidth > 0) return;
      el.onerror = () => { el.onerror = null; if (el.src !== fb) el.src = fb; };
      el.setAttribute("src", target);
    }

    /* ============================================================
       CORE PLAYBACK
       ============================================================ */
    async function playSong(song, auto, myToken) {
      if(!song||!song.sp){ setStatus("No track"); return; }
      const tag=`[play:${song.sp.slice(0,6)} "${song.title}"]`;

      /* helper: back-fill cover from gamepvz onto live track + persisted library.
         Always applies when cover is non-empty, even if a placeholder was set.
         Does NOT replace an existing HTTP(S) cover with a blank. */
      function backfillCover(cover){
        if(!cover) return;
        song.cover=cover;
        /* Propagate to all references in state.list (de-dup by sp) */
        state.list.forEach(t=>{ if(t.sp===song.sp) t.cover=cover; });
        /* Propagate to tops / news arrays so hero and track rows reflect it */
        [state.tops,state.news].forEach(arr=>arr.forEach(t=>{ if(t.sp===song.sp) t.cover=cover; }));
        /* Persist to library */
        const saved=S.list();
        const idx=saved.findIndex(x=>x.sp===song.sp);
        if(idx>=0){ saved[idx].cover=cover; S.save(saved); }
        paintNow();
      }

      /* ── Tier 1: gamepvz.com full Spotify MP3 — streamed via WISP ── */
      let t1Start=Date.now();
      try{
        setStatus("Fetching track…");
        console.log(tag,"tier1 gamepvz start");
        const file=await resolveSpotifyFile(song.sp);
        if(myToken!==state.token) return;
        backfillCover(file.cover);
        console.log(tag,"tier1 gamepvz resolved, streaming…",file.url.slice(0,60));
        setStatus("Streaming…");
        destroyEngine();
        await playStream(file.url, null, "audio/mpeg", "Spotify", false);
        if(myToken!==state.token){ destroyEngine(); return; }
        console.log(tag,"tier1 OK in "+(Date.now()-t1Start)+"ms (stream started)");
        state.skip=0; return;
      }catch(e){
        if(myToken!==state.token) return;
        console.warn(tag,"tier1 failed in "+(Date.now()-t1Start)+"ms:",e.message);
      }

      /* ── Tier 2: Native Spotify CDN (Mercury metadata + storage-resolve via stoken) ── */
      let t2Start=Date.now();
      try{
        setStatus("Resolving via native CDN…");
        console.log(tag,"tier2 native-spotify start");
        const native=await resolveSpotifyNative(song.sp);
        if(myToken!==state.token) return;
        console.log(tag,"tier2 native resolved, streaming…",native.url.slice(0,60));
        setStatus("Streaming…");
        destroyEngine();
        await playStream(native.url, null, native.mimeType, "Spotify", false);
        if(myToken!==state.token){ destroyEngine(); return; }
        console.log(tag,"tier2 native OK in "+(Date.now()-t2Start)+"ms");
        state.skip=0; return;
      }catch(e){
        if(myToken!==state.token) return;
        console.warn(tag,"tier2 native failed in "+(Date.now()-t2Start)+"ms:",e.message);
      }

      if(myToken!==state.token) return;
      console.error(tag,"all audio sources failed");
      setStatus("Couldn't play");
      state.playing=false; paintNow();
      toast("No audio source found");
      if(state.list.length>1) setTimeout(()=>{ if(myToken===state.token) next(); },2000);
    }

    /* ============================================================
       LOCAL FILE SUPPORT  (IndexedDB)
       ============================================================ */
    const IDB_NAME = "goarxyz-music", IDB_STORE = "tracks";
    function idbOpen() { return new Promise((res, rej) => { const req = indexedDB.open(IDB_NAME, 1); req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE); req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); }); }
    async function idbPut(id, blob) { const db = await idbOpen(); await new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, "readwrite"); tx.objectStore(IDB_STORE).put(blob, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
    async function idbGet(id) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE, "readonly"); const req = tx.objectStore(IDB_STORE).get(id); req.onsuccess = () => res(req.result || null); req.onerror = () => rej(req.error); }); }
    const isLocal = s => !!(s && (s.local || String(s.id || "").startsWith("local_")));

    /* ============================================================
       PLAYBACK CORE
       ============================================================ */

    /* prewarm: silently pre-resolve the next N Spotify tracks in the queue
       so they are already in spotifyFileCache when playAt
       reaches them.  Runs in the background — errors are fully ignored. */
    function prewarm(fromIndex, count=2){
      if(!state.list.length) return;
      const p=S.prefs();
      for(let k=1;k<=count;k++){
        let idx;
        if(p.shuffle){
          idx=Math.floor(Math.random()*state.list.length);
        } else {
          idx=(fromIndex+k)%state.list.length;
        }
        const s=state.list[idx];
        if(!s||isLocal(s)) continue;
        /* Pre-resolve URL only — no decode, no buffer, just prime the cache */
        if(!spotifyFileCache.has(s.sp)||spotifyFileCache.get(s.sp).exp<=Date.now()){
          console.log("[prewarm] resolving sp:",s.sp.slice(0,6),s.title);
          resolveSpotifyFile(s.sp).catch(()=>{});
        }
      }
    }

    async function playAt(i, auto) {
      if (!state.list.length) return;
      state.i = (i + state.list.length) % state.list.length;
      const song = current(), my = ++state.token;
      paintNow(); setStatus("Loading…");

      if (isLocal(song)) {
        destroyEngine();
        let blobUrl = null;
        try {
          const blob = await idbGet(song.id); if (!blob) throw new Error("File missing");
          blobUrl = URL.createObjectURL(blob);
          if (my !== state.token) { URL.revokeObjectURL(blobUrl); return; }
          /* Use playStream with blob URL — instant, no decode wait */
          await playStream(blobUrl, null, blob.type || "audio/mpeg", "local", false);
          if (my !== state.token) { destroyEngine(); URL.revokeObjectURL(blobUrl); return; }
          state.skip = 0;
          prewarm(state.i);
          return;
        } catch (e) {
          if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch {} }
          if (my !== state.token) return;
          state.playing = false; paintNow();
          toast(e.message || "Local file error");
        }
        return;
      }

      await playSong(song, auto, my);
      /* After playSong resolves (success or failure), if we're still the
         active token, kick off background resolution for the next 2 tracks */
      if(my===state.token) prewarm(state.i);
    }

    function next() {
      const p = S.prefs();
      if (p.repeat === "one") return playAt(state.i, true);
      if (p.shuffle) return playAt(Math.floor(Math.random() * state.list.length), true);
      playAt(state.i + 1, true);
    }
    function prev() {
      const cur = waCurrentTime();
      if (cur > 3) {
        if (engine.kind === "stream" && engine.streamEl) { engine.streamEl.currentTime = 0; return; }
        const audioBuf = engine.waSource && engine.waSource.buffer;
        if (audioBuf) { const was = !engine.waPaused; destroyWaSource(); playWa(audioBuf, 0, was, "seek", engine.isPreview); }
        return;
      }
      playAt(state.i - 1, true);
    }
    function jump(sp, auto) { const idx = state.list.findIndex(x => x.sp === sp); if (idx >= 0) playAt(idx, auto); }
    function useList(items, sp, auto) { state.list = items.slice(); const idx = Math.max(0, state.list.findIndex(x => x.sp === sp)); playAt(idx, auto); }

    function togglePlay() {
      if (!current()) return playAt(0, true);
      /* ── Streaming path ── */
      if (engine.kind === "stream" && engine.streamEl) {
        const el = engine.streamEl;
        if (el.paused) {
          el.play().catch(() => {});
          state.playing = true; engine.waPaused = false;
          if (!_waveRaf) startWave();
        } else {
          el.pause();
          state.playing = false; engine.waPaused = true;
        }
        paintNow(); return;
      }
      /* ── WA path (local files + preview) ── */
      const ctx = getAudioContext();
      if (engine.kind === "wa" && ctx) {
        if (engine.waPaused) {
          resumeWa(); engine.waStartAt = ctx.currentTime; engine.waPaused = false; state.playing = true;
          if (!_waveRaf) startWave();
        } else {
          const cur = waCurrentTime(); suspendWa(); engine.waOffset = cur; engine.waPaused = true; state.playing = false;
        }
        paintNow(); return;
      }
      playAt(state.i, true);
    }

    function openPlayer() {
      document.body.classList.add("np-open");
      $("#nowPlaying").classList.add("open");
      paintNow();
      /* Re-size the NP canvas now that the panel is visible and has real layout dimensions.
         Schedule one rAF so the browser has painted the panel before we read clientWidth. */
      requestAnimationFrame(() => {
        const npCanvas = document.getElementById("waveCanvas");
        if (npCanvas) _sizeCanvas(npCanvas, 420, 64);
        /* Re-start the wave loop so it picks up the newly-sized canvas */
        _stopWaveLoop();
        startWave();
      });
    }
    function closePlayer() {
      /* Do NOT stop wave — dock mini-wave should keep running.
         Just close the panel visually. */
      document.body.classList.remove("np-open");
      $("#nowPlaying").classList.remove("open");
    }

    /* ============================================================
       UI PAINT
       ============================================================ */
    const PLAY_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const PAUSE_ICON = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
    const NP_PLAY_ICON = `<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
    const NP_PAUSE_ICON = `<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

    function paintNow() {
      const s = current(), p = S.prefs();
      ["#btnShuffle", "#npShuffle"].forEach(id => { const el = $(id); if (el) el.classList.toggle("on", !!p.shuffle); });
      ["#btnRepeat", "#npRepeat"].forEach(id => { const el = $(id); if (el) el.classList.toggle("on", p.repeat !== "off"); });
      /* SVG play/pause icons */
      const bp = $("#btnPlay"), npb = $("#npPlay");
      if (bp) bp.innerHTML = state.playing ? PAUSE_ICON : PLAY_ICON;
      if (npb) npb.innerHTML = state.playing ? NP_PAUSE_ICON : NP_PLAY_ICON;
      if (!s) {
        const nt = $("#nowTitle"), na = $("#nowArtist");
        if (nt) nt.textContent = "—";
        if (na) na.textContent = "—";
        return;
      }
      const nt = $("#nowTitle"), na = $("#nowArtist"), npt = $("#npTitle"), npa = $("#npArtist");
      if (nt) nt.textContent = s.title;
      if (na) na.textContent = s.artist || "";
      if (npt) npt.textContent = s.title;
      if (npa) npa.textContent = s.artist || "";
      /* Trigger async cover fetch if this track has no artwork yet */
      if (s.sp && !s.cover && !s.local) fetchCoverForTrack(s);
      const art = s.cover || phArt;
      safeImg($("#nowArt"), art, phArt);
      safeImg($("#npArt"), art, phArt);
      const bg = $("#npBg"); if (bg) bg.style.backgroundImage = "url('" + art + "')";
      document.title = s.title + " — goarxyz";
      const lbl = $("#npLabel"); if (lbl) lbl.textContent = "Now playing";
      if (navigator.mediaSession) navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist || "", artwork: s.cover ? [{ src: s.cover, sizes: "300x300", type: "image/jpeg" }] : [] });
      /* ── Update next-track dock strip ── */
      const dn = document.getElementById("dockNext");
      if (dn) {
        const p2 = S.prefs();
        let nextIdx;
        if (p2.repeat === "one") nextIdx = state.i;
        else if (p2.shuffle) nextIdx = -1; // shuffle = unknown next
        else nextIdx = (state.i + 1) % state.list.length;
        const nextSong = nextIdx >= 0 ? state.list[nextIdx] : null;
        const dnt = document.getElementById("dockNextTitle");
        const dna = document.getElementById("dockNextArtist");
        const dnart = document.getElementById("dockNextArt");
        if (nextSong && nextSong !== s) {
          if (dnt) dnt.textContent = nextSong.title || "—";
          if (dna) dna.textContent = nextSong.artist || "";
          if (dnart) { dnart.onerror = () => { dnart.onerror = null; dnart.src = phArt; }; dnart.src = nextSong.cover || phArt; }
          dn.classList.add("visible");
        } else {
          dn.classList.remove("visible");
        }
      }
      paintQueue(); paintSide();
    }

    /* Guard vars — avoid full innerHTML rebuild when nothing changed */
    let _sideListKey = "", _queueKey = "";

    function paintSide() {
      const rows = state.list.slice(0, 24);
      const el = $("#sideLib"); if (!el) return;
      const cur = current();
      const key = rows.map(s => s.sp || s.id).join(",") + "|" + (cur && (cur.sp || cur.id) || "");
      if (key === _sideListKey) return; // nothing changed
      _sideListKey = key;
      el.innerHTML = rows.map(s => `<div class="lib-item ${cur && cur.sp === s.sp ? "on" : ""}" data-sp="${esc(s.sp || s.id)}"><img src="${esc(s.cover || phArt)}" onerror="this.src='${phArt}'" alt=""><div><b>${esc(s.title)}</b><span>${esc(s.artist || "")}</span></div></div>`).join("");
      el.querySelectorAll(".lib-item").forEach(el => el.onclick = () => jump(el.dataset.sp || el.dataset.id, true));
      const on = el.querySelector(".lib-item.on");
      if (on) on.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    function paintQueue() {
      const box = $("#npQueue"); if (!box) return;
      const key = state.list.map(s => s.sp || s.id).join(",") + "|" + state.i;
      if (key === _queueKey) return; // nothing changed
      _queueKey = key;
      box.innerHTML = "<h3>Up next</h3>" + state.list.map((s, i) => `<div class="np-qrow ${i === state.i ? "on" : ""}" data-i="${i}"><img src="${esc(s.cover || phArt)}" onerror="this.src='${phArt}'" alt=""><div><div class="t-title">${esc(s.title)}</div><div class="t-sub">${esc(s.artist || "")}</div></div></div>`).join("");
      const cur = box.querySelector(".np-qrow.on");
      if (cur) cur.scrollIntoView({ block: "nearest", behavior: "smooth" });
      box.querySelectorAll(".np-qrow").forEach(el => el.onclick = () => playAt(Number(el.dataset.i), true));
    }

    function trackRows(items) {
      const DL_ICON = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"/></svg>`;
      return `<table class="tracks"><thead><tr><th class="num">#</th><th>Title</th><th style="width:64px"></th></tr></thead><tbody>
  ${items.map((s, i) => `<tr data-sp="${esc(s.sp)}" class="${current() && current().sp === s.sp ? "on" : ""}"><td class="num">${i + 1}</td><td><div style="display:flex;gap:10px;align-items:center"><img class="t-art" src="${esc(s.cover || phArt)}" onerror="this.src='${phArt}'" alt=""><div><div class="t-title">${esc(s.title)}</div><div class="t-sub">${esc(s.artist || "")}</div></div></div></td><td style="display:flex;gap:6px;align-items:center"><button class="add" data-sp="${esc(s.sp)}" title="Save to library">+</button><button class="dl" data-dl="${esc(s.sp)}" title="Download MP3">${DL_ICON}</button></td></tr>`).join("")}
  </tbody></table>`;
    }

    function bindTracks(root, items) {
      root.querySelectorAll("tr[data-sp]").forEach(el => el.onclick = e => {
        if (e.target.closest(".add,[data-dl]")) return;
        const song = items.find(x => x.sp === el.dataset.sp); if (!song) return;
        useList(items, song.sp, true);
      });
      root.querySelectorAll("button.add[data-sp]").forEach(btn => btn.onclick = e => {
        e.stopPropagation();
        const song = items.find(x => x.sp === btn.dataset.sp); if (song) addSong(song);
      });
      root.querySelectorAll("button.dl[data-dl]").forEach(btn => btn.onclick = e => {
        e.stopPropagation();
        const song = items.find(x => x.sp === btn.dataset.dl); if (song) downloadTrack(song);
      });
    }

    /* ============================================================
       SEEK / TIME
       ============================================================ */
    function mediaTime() {
      if (engine.kind === "stream" && engine.streamEl) {
        const el = engine.streamEl;
        return { cur: el.currentTime || 0, dur: isFinite(el.duration) ? el.duration : 0 };
      }
      if (engine.kind === "wa") return { cur: Math.min(waCurrentTime(), engine.waDur || 0), dur: engine.waDur || 0 };
      return { cur: 0, dur: 0 };
    }
    function bindSeek(el) {
      if (!el) return;
      el.oninput = e => {
        const { dur } = mediaTime(); if (!dur) return;
        const t = (e.target.value / 1000) * dur;
        if (engine.kind === "stream" && engine.streamEl) {
          engine.streamEl.currentTime = t;
        } else if (engine.kind === "wa") {
          const audioBuf = engine.waSource && engine.waSource.buffer;
          if (!audioBuf) return;
          const was = !engine.waPaused;
          const ctx = getAudioContext(); if (!ctx) return;
          if (engine.waGain) { try { engine.waGain.disconnect(); } catch { } engine.waGain = null; }
          destroyWaSource();
          playWa(audioBuf, t, was, "seek", engine.isPreview).catch(() => { });
        }
      };
    }
    function _setProgPct(pct) {
      const w = (pct * 100).toFixed(2) + "%";
      const pf = document.getElementById("progFill"), pt = document.getElementById("progThumb");
      if (pf) { pf.style.setProperty("--progress-bar-transform", w); pf.style.width = w; }
      if (pt) { pt.style.setProperty("--progress-bar-transform", w); pt.style.left = w; }
      /* dock top progress line — always visible including on mobile */
      const dp = document.getElementById("dockProgFill");
      if (dp) dp.style.width = w;
    }
    function tick() {
      const { cur, dur } = mediaTime();
      const pct = dur ? cur / dur : 0;
      const ct = $("#curT"), dt = $("#durT"), nct = $("#npCur"), ndt = $("#npDur"), nsk = $("#npSeek");
      if (ct) ct.textContent = fmt(cur); if (dt) dt.textContent = fmt(dur);
      if (nct) nct.textContent = fmt(cur); if (ndt) ndt.textContent = fmt(dur);
      if (nsk && document.activeElement !== nsk) nsk.value = dur ? Math.floor(pct * 1000) : 0;
      _setProgPct(pct);
    }
    setInterval(() => { if (engine.kind === "stream" || engine.kind === "wa") tick(); }, 250);

    /* ============================================================
       SAVE TO LIBRARY
       ============================================================ */
    function addSong(song) {
      if (!song || !song.sp) return;
      const saved = S.list();
      if (saved.some(x => x.sp === song.sp)) return toast("Already saved");
      saved.unshift({ sp: song.sp, id: "sp_" + song.sp, title: song.title || song.sp, artist: song.artist || "", cover: song.cover || "" });
      S.save(saved); toast("Saved"); paintSide();
      if (state.view === "library") viewLibrary();
    }

    /* ============================================================
       DOWNLOAD TRACK
       Resolves the gamepvz URL then fetches the MP3 as a blob and
       triggers a browser download.  Uses the track title as filename.
       ============================================================ */
    async function downloadTrack(song) {
      if (!song || !song.sp) return;
      toast("Preparing download…");
      try {
        const file = await resolveSpotifyFile(song.sp);
        const r = await fetchAny(file.url, { headers: { "user-agent": "Mozilla/5.0", "accept": "audio/mpeg,*/*" } }, 60000);
        if (!r || !r.ok) throw new Error("HTTP " + (r && r.status));
        const blob = await r.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (song.title || song.sp).replace(/[/\\:*?"<>|]/g, "_") + ".mp3";
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
        toast("Downloaded: " + song.title);
      } catch (e) { toast("Download failed: " + (e.message || e)); }
    }

    /* ============================================================
       VIEWS
       ============================================================ */
    let heroRotateTimer = null, heroIdx = 0;

    function setNav() { $$("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === state.view)); }

    function rotateHero() {
      const art = $("#heroArt"); if (!art) return;
      const pool = state.tops.length ? state.tops : [];
      if (!pool.length) return;
      heroIdx = (heroIdx + 1) % pool.length;
      const pick = pool[heroIdx];
      art.classList.add("fade");
      setTimeout(() => {
        art.dataset.sp = pick.sp || "";
        safeImg(art, pick.cover || phArt, phArt);
        const te = $("#heroTitle"), se = $("#heroSub");
        if (te) te.textContent = pick.title;
        if (se) se.textContent = pick.artist || "";
        art.classList.remove("fade");
      }, 600);
    }
    function startHeroRotate() { clearInterval(heroRotateTimer); heroRotateTimer = setInterval(rotateHero, 8000); }

    function viewHome() {
      state.view = "home"; setNav(); clearInterval(heroRotateTimer);
      const tops = state.tops.length ? state.tops : [];
      const news = state.news.length ? state.news : [];
      const feat = tops[0] || null;
      heroIdx = 0;
      const loading = !tops.length;
      $("#stage").innerHTML = `
    <div class="topbar">
      <button class="circle" type="button" id="backBtn">←</button>
      <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <input id="q" placeholder="Search Spotify…"></div>
    </div>
    <div class="page">
      <div class="hero">
        <img class="hero-art" id="heroArt" data-sp="${esc(feat && feat.sp || '')}" src="${esc(feat && feat.cover || phArt)}" onerror="this.src='${phArt}'" alt="">
        <div>
          <div class="kicker">Today · ${new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</div>
          <h1>Top Picks</h1>
          <p style="color:#c084fc;font-size:13px;font-weight:600;margin-bottom:4px" id="heroTitle">${esc(feat && feat.title || (loading ? "Loading…" : ""))}</p>
          <p id="heroSub" style="color:#c7c8d0;max-width:560px;margin-bottom:16px">${esc(feat && feat.artist || "")}</p>
          <p style="color:#c7c8d0;max-width:560px;margin-bottom:16px">Spotify catalogue · Native CDN audio · WISP tunnel · Instant full-track playback</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            ${tops.length ? `<button class="btn btn-play" id="heroPlay">Play</button>` : ""}
            <button class="btn btn-ghost" id="heroOpen">Open player</button>
          </div>
        </div>
      </div>
      ${tops.length ? `<div class="section" id="secTops"><div class="section-head"><h2>Today's Top Picks</h2><span class="see" id="seeTops">Play all</span></div>${trackRows(tops.slice(0, 12))}</div>` : `<div class="empty" style="padding:60px 0">Loading charts…</div>`}
      ${news.length ? `<div class="section" id="secNews"><div class="section-head"><h2>New Releases</h2><span class="see" id="seeNews">Play all</span></div>${trackRows(news.slice(0, 10))}</div>` : ""}
    </div>`;
      bindTracks($("#stage"), tops.concat(news));
      const hp = $("#heroPlay"); if (hp) hp.onclick = () => useList(tops, tops[0] && tops[0].sp, true);
      $("#heroOpen").onclick = () => { if (!current() && tops.length) useList(tops, tops[0].sp, false); openPlayer(); };
      const st = $("#seeTops"); if (st) st.onclick = () => useList(tops, tops[0] && tops[0].sp, true);
      const sn = $("#seeNews"); if (sn) sn.onclick = () => news.length && useList(news, news[0].sp, true);
      $("#q").addEventListener("keydown", e => { if (e.key === "Enter") viewSearch(e.target.value.trim()); });
      $("#backBtn").onclick = viewHome;
      if (tops.length) startHeroRotate();
    }

    function viewLibrary() {
      state.view = "library"; setNav(); clearInterval(heroRotateTimer);
      const saved = S.list();
      $("#stage").innerHTML = `<div class="topbar"><button class="circle" type="button" id="backBtn">←</button></div>
    <div class="page"><div class="hero"><div class="hero-art" style="display:grid;place-items:center;background:linear-gradient(135deg,#a855f7,#5b8def);font-size:64px">♪</div>
    <div><div class="kicker">Playlist</div><h1>Your Library</h1><p>${saved.length ? saved.length + " saved tracks" : "Save a track or drop local files."}</p>
    <div style="display:flex;gap:10px"><button class="btn btn-play" id="libPlay">Play</button><button class="btn btn-ghost" id="libFiles">Add files</button></div></div></div>
    ${saved.length ? trackRows(saved) : '<div class="empty">Nothing saved yet. Hit + on any track.</div>'}</div>`;
      bindTracks($("#stage"), saved);
      $("#libPlay").onclick = () => { if (saved.length) useList(saved, saved[0].sp || saved[0].id, true); };
      $("#libFiles").onclick = () => $("#filePick").click();
      $("#backBtn").onclick = viewHome;
    }

    function viewSearch(q0 = "") {
      state.view = "search"; setNav(); clearInterval(heroRotateTimer);
      $("#stage").innerHTML = `<div class="topbar"><button class="circle" type="button" id="backBtn">←</button>
    <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
    <input id="q" value="${esc(q0)}" placeholder="Song, artist, or Spotify link" autofocus></div></div>
    <div class="page"><div id="sres" class="empty">Type a query and press Enter.</div></div>`;
      $("#backBtn").onclick = viewHome;
      let _searchTimer = null;
      const run = async () => {
        const q = $("#q").value.trim(); const box = $("#sres");
        if (!q) { box.className = "empty"; box.textContent = "Type a query and press Enter."; return; }
        box.className = "empty"; box.textContent = "Searching…";
        try {
          const items = await spotifySearch(q);
          /* If user typed something else while this search was in flight, discard */
          if (q !== ($("#q") && $("#q").value.trim())) return;
          if (!items.length) { box.textContent = "No results — try again."; return; }
          box.className = ""; box.innerHTML = trackRows(items); bindTracks(box, items);
          ensureCovers(items);
        } catch (e) { box.textContent = e.message || "Search failed"; }
      };
      const qEl = $("#q");
      /* Run on Enter key immediately */
      qEl.addEventListener("keydown", e => { if (e.key === "Enter") { clearTimeout(_searchTimer); run(); } });
      /* Also run with 300 ms debounce on keyup for instant feel */
      qEl.addEventListener("keyup", e => {
        if (e.key === "Enter") return; // already handled above
        clearTimeout(_searchTimer);
        const v = qEl.value.trim();
        if (v.length < 2) return;
        _searchTimer = setTimeout(run, 300);
      });
      if (q0) run();
    }

    function goView(name) { if (name === "home") viewHome(); else if (name === "search") viewSearch(""); else if (name === "library") viewLibrary(); }

    /* ============================================================
       LOAD LIVE CHARTS  (with 24-hour localStorage cache)
       ============================================================ */
    async function loadCharts() {
      /* 1. Serve from localStorage cache if still fresh (< 24 h) */
      const persisted = _chartCacheGet();
      if (persisted && persisted.tops && persisted.tops.length) {
        state.tops = persisted.tops;
        state.news = persisted.news || [];
        /* Also warm the in-memory chartCache map */
        chartCache.set(dayKey(), { tops: state.tops, news: state.news });
        if (!S.list().length) state.list = state.tops.slice();
        if (state.view === "home") viewHome();
        paintSide();
        ensureCovers(state.tops.concat(state.news));
        return;
      }

      /* 2. Fall back to in-memory chartCache (same session, charts already fetched) */
      const memCached = chartCache.get(dayKey());
      if (memCached) {
        state.tops = memCached.tops || []; state.news = memCached.news || [];
        if (state.view === "home") viewHome(); paintSide();
        ensureCovers(state.tops.concat(state.news));
        return;
      }

      /* 3. Fetch live from Spotify embed scrape */
      try {
        const [topsRaw, newsRaw] = await Promise.all([
          spotifyPlaylist(CHARTS[0].id),
          spotifyPlaylist(CHARTS[1].id)
        ]);
        if (topsRaw.length) state.tops = topsRaw.slice(0, 40);
        if (newsRaw.length) state.news = newsRaw.slice(0, 40);
        /* Persist to both caches */
        chartCache.set(dayKey(), { tops: state.tops, news: state.news });
        _chartCacheSet(state.tops, state.news);
        if (!S.list().length) state.list = state.tops.slice();
        if (state.view === "home") viewHome();
        paintSide();
        ensureCovers(state.tops.concat(state.news));
      } catch (e) {
        /* Charts failed — home view shows "Loading…" and will retry on next interaction */
        if (state.view === "home") viewHome();
        ensureCovers(state.list);
      }
    }

    /* ============================================================
       VOLUME / CONTROLS WIRING
       ============================================================ */
    function toggleShuffle() { S.setPrefs({ shuffle: !S.prefs().shuffle }); paintNow(); toast("Shuffle " + (S.prefs().shuffle ? "on" : "off")); }
    function cycleRepeat() { const o = ["off", "all", "one"]; S.setPrefs({ repeat: o[(o.indexOf(S.prefs().repeat) + 1) % 3] }); toast("Repeat " + S.prefs().repeat); paintNow(); }

    bindSeek($("#npSeek")); // only NP panel has the hidden range input now
    $("#btnPlay").onclick = $("#npPlay").onclick = togglePlay;
    $("#btnNext").onclick = $("#npNext").onclick = next;
    $("#btnPrev").onclick = $("#npPrev").onclick = prev;
    $("#btnShuffle").onclick = $("#npShuffle").onclick = toggleShuffle;
    $("#btnRepeat").onclick = $("#npRepeat").onclick = cycleRepeat;
    $("#openNow").onclick = openPlayer; $("#expandBtn").onclick = openPlayer;
    $("#npClose").onclick = closePlayer;
    $("#npSave").onclick = () => { if (current()) addSong(current()); };

    $$("[data-view]").forEach(b => b.onclick = () => goView(b.dataset.view));

    /* Guarded addFiles wiring */
    const addFilesBtn = $("#addFiles"), mAddBtn = $("#mAdd");
    if (addFilesBtn) addFilesBtn.onclick = () => $("#filePick").click();
    if (mAddBtn) mAddBtn.onclick = () => $("#filePick").click();

    $("#filePick").onchange = async e => {
      const files = [...e.target.files || []].filter(f => /^audio\//.test(f.type) || /\.(mp3|m4a|ogg|wav|flac|aac|opus)$/i.test(f.name));
      for (const file of files) {
        const id = "local_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        await idbPut(id, file);
        addSong({ sp: id, id, title: file.name.replace(/\.[^.]+$/, ""), artist: "This device", cover: "", local: true });
      }
      if (files.length) toast("Added " + files.length);
      e.target.value = ""; if (state.view === "library") viewLibrary();
    };

    document.addEventListener("keydown", e => {
      if (e.target.matches("input,textarea")) return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      if (e.code === "ArrowRight") next();
      if (e.code === "ArrowLeft") prev();
      if (e.code === "Escape") closePlayer();
      if (e.code === "KeyF") openPlayer();
    });
    if (navigator.mediaSession) {
      navigator.mediaSession.setActionHandler("play", togglePlay);
      navigator.mediaSession.setActionHandler("pause", togglePlay);
      navigator.mediaSession.setActionHandler("nexttrack", next);
      navigator.mediaSession.setActionHandler("previoustrack", prev);
    }

    /* ── Volume bar click ── */
    document.getElementById("volTrack").onclick = e => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const v = Math.round(pct * 100);
      /* Apply to whichever engine is active */
      if (engine.waGain) engine.waGain.gain.value = pct;
      if (engine.kind === "stream" && engine.streamEl) engine.streamEl.volume = pct;
      S.setPrefs({ vol: v });
      document.getElementById("volFill").style.width = v + "%";
    };

    /* ── Progress bar click ── */
    document.getElementById("progWrap").onclick = e => {
      const { dur } = mediaTime(); if (!dur) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const t = pct * dur;
      if (engine.kind === "stream" && engine.streamEl) {
        engine.streamEl.currentTime = t;
      } else if (engine.kind === "wa") {
        const audioBuf = engine.waSource && engine.waSource.buffer;
        if (!audioBuf) return;
        const was = !engine.waPaused;
        if (engine.waGain) { try { engine.waGain.disconnect(); } catch { } engine.waGain = null; }
        destroyWaSource();
        playWa(audioBuf, t, was, "seek", engine.isPreview).catch(() => { });
      }
    };

    /* ── Save heart button in dock ── */
    document.getElementById("dockSave").onclick = e => { e.stopPropagation(); if (current()) addSong(current()); };

    /* ============================================================
       BOOT
       ============================================================ */
    viewHome();
    paintNow();

    /* Set initial volume bar from saved prefs */
    (() => { const v = S.prefs().vol || 80; const vf = document.getElementById("volFill"); if (vf) vf.style.width = v + "%"; })();

    /* WISP tunnel → anon token prefetch → charts + cover backfill
       stoken is only needed as a fallback and is fetched lazily on demand */
    ensureLibcurl()
      .then(() => {
        return spotifyAnonToken().catch(() => {})
          .then(() => {
            SpotifyDealer.start();
            ensureCovers(state.list);
            return loadCharts();
          });
      })
      .catch(() => loadCharts());
  </script>
<script src="/shared/float.js" defer></script>
<script src="https://cdn.staticdelivr.com/gh/cxyz22x/analytics.js/refs/heads/main/analytics.js" defer></script></body>
