<!DOCTYPE html>
<html lang="en">
<head>
<meta name="referrer" content="strict-origin-when-cross-origin" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>goarxyz — Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="music.css" />
<script src="https://cdn.jsdelivr.net/npm/libcurl.js@0.7.4/libcurl_full.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link rel="stylesheet" href="/shared/float.css" />
</head>
<body class="app">
<aside class="sidebar">
  <div class="side-card">
    <a class="logo" href="/index.html">goarxyz <span class="marks"><span>○</span><span>□</span><span>△</span><span>✕</span></span></a>
    <button class="nav-btn on" data-view="home">Music Home</button>
    <button class="nav-btn" data-view="search">Search</button>
    <button class="nav-btn" data-view="library">Your Library</button>
  </div>
  <div class="side-card" style="flex:1;min-height:0">
    <div class="lib-head">Queue <button type="button" id="addFiles">+ files</button></div>
    <div class="lib-list" id="sideLib"></div>
  </div>
</aside>
<main class="stage" id="stage"></main>
<footer class="dock" id="dock">
  <div class="now" id="openNow" title="Open player">
    <img id="nowArt" alt="">
    <div><b id="nowTitle">Today's Top Picks</b><span id="nowArtist">Open full player</span></div>
  </div>
  <div class="controls">
    <div class="ctrl-row">
      <button class="ctrl" id="btnShuffle">↝</button>
      <button class="ctrl" id="btnPrev">⏮</button>
      <button class="play" id="btnPlay">▶</button>
      <button class="ctrl" id="btnNext">⏭</button>
      <button class="ctrl" id="btnRepeat">🔁</button>
    </div>
    <div class="seek-row"><span id="curT">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="durT">0:00</span></div>
  </div>
  <div class="extra">
    <span class="status" id="playStatus">Starting…</span>
    <input id="vol" type="range" min="0" max="100" value="80" style="width:90px">
    <button class="expand" id="expandBtn" title="Full player">⛶</button>
  </div>
</footer>
<nav class="mnav">
  <button type="button" data-view="home" class="on">Home</button>
  <button type="button" data-view="search">Search</button>
  <button type="button" data-view="library">Library</button>
  <button type="button" id="mAdd">+ files</button>
</nav>

<section class="np" id="nowPlaying" aria-label="Now playing">
  <div class="np-bg" id="npBg"></div>
  <div class="np-top">
    <button type="button" id="npClose">↓  Home</button>
    <span id="npLabel">Now playing</span>
    <button type="button" id="npSave">Save</button>
  </div>
  <div class="np-body">
    <div class="np-artwrap">
      <img class="np-art" id="npArt" alt="">
      <div class="np-meta"><h2 id="npTitle">—</h2><p id="npArtist">—</p></div>
    </div>
    <aside class="np-queue" id="npQueue"></aside>
  </div>
  <div class="np-foot">
    <div class="np-seek"><span id="npCur">0:00</span><input id="npSeek" type="range" min="0" max="1000" value="0"><span id="npDur">0:00</span></div>
    <div class="np-ctrls">
      <button class="ctrl" id="npShuffle">↝</button>
      <button class="ctrl" id="npPrev">⏮</button>
      <button class="play" id="npPlay">▶</button>
      <button class="ctrl" id="npNext">⏭</button>
      <button class="ctrl" id="npRepeat">🔁</button>
    </div>
  </div>
</section>

<audio id="player" preload="auto" playsinline referrerpolicy="no-referrer"></audio>
<div id="ytHost" aria-hidden="true"><div id="ytMount"></div></div>
<input id="filePick" type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.aac,.opus" multiple hidden>
<div class="tunnel" id="tunnelChip"><span id="tunnelLabel"></span><select id="wispSelect"></select><button id="wispRetry" type="button"></button></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="/shared/aes.js"></script>
<script src="/shared/protect.js"></script>
<script src="music.js?v=17"></script>
<script src="/shared/float.js" defer></script>
</body>
</html>
