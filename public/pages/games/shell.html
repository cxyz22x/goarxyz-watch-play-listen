  var tripped = false;
  function wipe() {

    try { location.replace('about:blank'); } catch (e) {}

    var start = performance.now();

  setInterval(function () {

  });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); wipe(); });
})();
