<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live TV — goarxyz</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="live.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<link rel="stylesheet" href="/shared/float.css" />
</head>
<body>
<header>
  <a class="logo" href="/index.html">goarxyz <span class="marks"><span>○</span><span>□</span><span>△</span><span>✕</span></span></a>
  <input id="q" placeholder="Search channels" autocomplete="off" />
</header>
<div class="chips" id="chips"></div>
<section class="hero" id="hero">
  <div class="hero-copy">
    <div class="eyebrow" id="heroKicker">Live</div>
    <h1 id="heroTitle">Loading channels</h1>
    <p id="heroText">US, UK, Australia, Canada, Ireland, and New Zealand.</p>
    <button class="play" id="heroPlay" type="button">Play</button>
  </div>
</section>
<div id="rails"></div>

<div class="now" id="nowbar">
  <img id="nowLogo" alt="" referrerpolicy="no-referrer" />
  <div class="who">
    <small>Now playing</small>
    <b id="nowName">—</b>
    <span id="nowMeta">—</span>
  </div>
  <button class="open" id="nowOpen" type="button">Open</button>
  <button id="nowStop" type="button">Stop</button>
</div>

<div class="player" id="player">
  <div class="pbar">
    <button type="button" id="close" aria-label="Close">✕</button>
    <div class="who">
      <b id="playerName">Live</b>
      <small id="playerMeta">Live</small>
    </div>
    <select id="quality" aria-label="Quality">
      <option value="auto">Auto</option>
      <option value="1080">1080p</option>
      <option value="720">720p</option>
      <option value="480">480p</option>
    </select>
  </div>
  <div class="stage">
    <video id="video" controls autoplay playsinline></video>
    <div class="status" id="status"></div>
  </div>
</div>
<script src="/shared/aes.js"></script>
<script src="/shared/protect.js"></script>
<script src="live.js"></script>
<script src="/shared/float.js" defer></script>
</body>
</html>
