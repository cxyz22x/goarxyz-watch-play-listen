    <script type="text/javascript">
        function sendInfo() {
            MarketJSPlatformLogoutAPI.initialize();
            $('#register-form').attr('action', _API_URL + '/api/user/register')
            var name = document.getElementById("register-name").value;
            ig.game.playerName = name;
            var email = document.getElementById("register-non-unique-id").value;
            ig.game.playerEmail = email;
            var obj = {
                "name":name,
                "email":email,
                "ball_number":null
            };
            var str = JSON.stringify(obj);
            document.getElementById("register-info").value = str;
            document.getElementById("register-password").value = name;
        }
        function clearFields() {
            document.getElementById("register-name").value = "";
            document.getElementById("register-non-unique-id").value = "";
            document.getElementById("register-tos-agree").checked = false;
        }
        function skipForm() {
            try {
                MarketJSPlatformLogoutAPI.initialize();
                $('#register-form').attr('action', '')
                MarketJSPlatformLoginAPI.hideRegister();
                setTimeout(function(){
                    ig.game.isSkip=true;
                    ig.game.director.jumpTo(LevelGame);
                    ig.visibilityHandler.resumeHandler();
                }, 100);
            } catch (e) {

            }
        }
    </script>
    <script type="text/javascript">
        function validateTosCheckbox() {
            var checked = document.getElementById("register-tos-agree").checked;
            var error = document.getElementById("register-tos-agree-error");
            if (checked === true)
                error.style.display = 'none';
            else
                error.style.display = 'block';
        }
    </script>
